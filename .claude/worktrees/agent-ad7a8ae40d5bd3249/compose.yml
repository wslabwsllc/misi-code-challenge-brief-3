# Memorial Event Operations — complete local stack (brief §10: clean-machine run with Git and Docker only).
#
#   docker compose up -d --wait      build, create secrets, start everything, migrate and seed, wait until healthy
#   docker compose down              stop; data is kept
#   docker compose down --volumes    DESTRUCTIVE: deletes database, files and storage
#
# Order: init (secrets) -> db + storage -> storage-init (bucket) -> migrate (migrations + idempotent seed) -> web, worker, mocks.
# Only the web app (127.0.0.1:5280) and the S3 API used for download redirects (127.0.0.1:9000) are published, on loopback.
name: event-permits

x-web-image: &web-image
  build:
    context: .
    dockerfile: Dockerfile
  image: event-permits/web:local

x-mocks-image: &mocks-image
  build:
    context: .
    dockerfile: src/EventPermits.Mocks/Dockerfile
  image: event-permits/mocks:local

# Settings shared by web, worker and migrate. Secrets are files in ./.data/secrets/app (key-per-file),
# the same keys AWS passes as environment variables.
x-app-env: &app-env
  Secrets__Directory: /run/all-secrets/app
  Database__ConnectionString: Host=db;Port=5432;Database=eventpermits;Username=eventpermits;Gss Encryption Mode=Disable
  Storage__ServiceUrl: http://storage:8333
  Storage__PublicEndpoint: http://127.0.0.1:${STORAGE_PORT:-9000}
  Storage__ForcePathStyle: "true"
  Storage__Bucket: event-permits
  Integrations__Registry__BaseUrl: http://mock-registry:8080
  Integrations__Calendar__BaseUrl: http://mock-calendar:8080
  Integrations__Calendar__ClientId: event-permits-app
  Integrations__Notify__BaseUrl: http://mock-notify:8080
  Integrations__Weather__BaseUrl: http://mock-weather:8080
  Integrations__Geocode__BaseUrl: http://mock-geocode:8080
  Integrations__PartnerFeed__AdminUrl: http://mock-partner-feed:8080

x-mock-env: &mock-env
  Mock__SecretsDirectory: /run/all-secrets/mocks
  Mock__Calendar__ClientId: event-permits-app

x-mock-health: &mock-health
  test: ["CMD", "dotnet", "/app/EventPermits.Mocks.dll", "probe", "http://localhost:8080/health"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 10s

services:
  # One-shot: creates ./.data/secrets once (database, storage identities, signing keys, integration keys); keeps existing values.
  init:
    <<: *web-image
    command: ["init-local"]
    environment:
      BOOTSTRAP_DIR: /bootstrap
    volumes:
      - ./.data/secrets:/bootstrap
    network_mode: none
    restart: "no"

  db:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: eventpermits
      POSTGRES_USER: eventpermits
      POSTGRES_PASSWORD_FILE: /run/all-secrets/db_password
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ./.data/secrets:/run/all-secrets:ro
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker inside this mount.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpermits -d eventpermits"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  # S3-compatible object storage (SeaweedFS replaces MinIO, whose images are no longer public; see A-30).
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-s3", "-s3.port=8333", "-s3.config=/run/all-secrets/s3.json", "-dir=/data", "-master.volumeSizeLimitMB=256", "-ip.bind=0.0.0.0"]
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:8333"
    volumes:
      - ./.data/secrets:/run/all-secrets:ro
      - storage-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [backend]
    restart: unless-stopped

  # One-shot: creates the private bucket with the storage admin identity (the app's own key cannot create buckets).
  storage-init:
    <<: *web-image
    command: ["storage-init"]
    environment:
      Secrets__Directory: /run/all-secrets/storage-admin
      Storage__ServiceUrl: http://storage:8333
      Storage__ForcePathStyle: "true"
      Storage__Bucket: event-permits
    depends_on:
      storage:
        condition: service_healthy
    volumes:
      - ./.data/secrets:/run/all-secrets:ro
    networks: [backend]
    restart: "no"

  # One-shot: migrations, then the idempotent seed. The documented local demo password is enabled here only (OD-2).
  migrate:
    <<: *web-image
    command: ["migrate"]
    environment:
      <<: *app-env
      Seed__AllowDemoPassword: "true"
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - ./.data/secrets:/run/all-secrets:ro
    networks: [backend]
    restart: "no"

  web:
    <<: *web-image
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Started, not healthy: an integration outage must never stop the web app.
      mock-registry: { condition: service_started }
      mock-calendar: { condition: service_started }
      mock-notify: { condition: service_started }
      mock-weather: { condition: service_started }
      mock-geocode: { condition: service_started }
      mock-partner-feed: { condition: service_started }
    ports:
      - "127.0.0.1:${WEB_PORT:-5280}:8080"
    volumes:
      - ./.data/secrets:/run/all-secrets:ro
    healthcheck:
      test: ["CMD", "dotnet", "/app/EventPermits.Web.dll", "probe", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s
    networks: [backend]
    restart: unless-stopped

  worker:
    <<: *web-image
    command: ["worker"]
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./.data/secrets:/run/all-secrets:ro
    healthcheck:
      test: ["CMD", "dotnet", "/app/EventPermits.Web.dll", "probe", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s
    networks: [backend]
    restart: unless-stopped

  mock-registry:
    <<: *mocks-image
    command: ["--service", "registry"]
    environment:
      <<: *mock-env
      Mock__Mode: ${REGISTRY_MODE:-normal}
    depends_on: { init: { condition: service_completed_successfully } }
    volumes: ["./.data/secrets:/run/all-secrets:ro"]
    healthcheck: *mock-health
    networks: [backend]
    restart: unless-stopped

  mock-calendar:
    <<: *mocks-image
    command: ["--service", "calendar"]
    environment:
      <<: *mock-env
      Mock__Mode: ${CALENDAR_MODE:-normal}
    depends_on: { init: { condition: service_completed_successfully } }
    volumes: ["./.data/secrets:/run/all-secrets:ro"]
    healthcheck: *mock-health
    networks: [backend]
    restart: unless-stopped

  mock-notify:
    <<: *mocks-image
    command: ["--service", "notify"]
    environment:
      <<: *mock-env
      Mock__Mode: ${NOTIFY_MODE:-normal}
      Mock__Notify__WebhookUrl: http://web:8080/webhooks/delivery
    depends_on: { init: { condition: service_completed_successfully } }
    volumes: ["./.data/secrets:/run/all-secrets:ro"]
    healthcheck: *mock-health
    networks: [backend]
    restart: unless-stopped

  mock-weather:
    <<: *mocks-image
    command: ["--service", "weather"]
    environment:
      <<: *mock-env
      Mock__Mode: ${WEATHER_MODE:-normal}
    depends_on: { init: { condition: service_completed_successfully } }
    volumes: ["./.data/secrets:/run/all-secrets:ro"]
    healthcheck: *mock-health
    networks: [backend]
    restart: unless-stopped

  mock-geocode:
    <<: *mocks-image
    command: ["--service", "geocode"]
    environment:
      <<: *mock-env
      Mock__Mode: ${GEOCODE_MODE:-normal}
    depends_on: { init: { condition: service_completed_successfully } }
    volumes: ["./.data/secrets:/run/all-secrets:ro"]
    healthcheck: *mock-health
    networks: [backend]
    restart: unless-stopped

  mock-partner-feed:
    <<: *mocks-image
    command: ["--service", "partner-feed"]
    environment:
      <<: *mock-env
      Mock__PartnerFeed__ServiceUrl: http://storage:8333
      Mock__PartnerFeed__ForcePathStyle: "true"
      Mock__PartnerFeed__Bucket: event-permits
      Mock__PartnerFeed__ScheduleEnabled: "true"
    depends_on:
      init: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
    volumes: ["./.data/secrets:/run/all-secrets:ro"]
    healthcheck: *mock-health
    networks: [backend]
    restart: unless-stopped

volumes:
  db-data:
  storage-data:

networks:
  backend:
